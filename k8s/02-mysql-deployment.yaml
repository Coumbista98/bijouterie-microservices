# Deployment MySQL (version bonus) : image officielle mysql:8.4,
# données sur un PVC, init.sql fourni par une ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  replicas: 1
  # Recreate : l'ancien pod s'arrête AVANT la création du nouveau
  # (un volume ReadWriteOnce ne peut pas être utilisé par deux pods à la fois)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bijouterie
      tier: database
  template:
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.4   # image officielle, tag explicite
          ports:
            - containerPort: 3306
          # envFrom : toutes les clés du Secret
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            # données MySQL : conservées dans le PVC
            - name: mysql-data
              mountPath: /var/lib/mysql
            # scripts d'initialisation : exécutés seulement si /var/lib/mysql est vide
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-initdb