# Deployment frontend : 2 replicas Nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bijouterie
      tier: frontend
  template:
    metadata:
      labels:
        app: bijouterie
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: diagnecoumba/bijouterie-frontend:1   # tag explicite, pas latest
          ports:
            - containerPort: 80
          # envFrom : BACKEND_URL et MAX_UPLOAD_SIZE
          #chargement des variables d'environnement depuis la ConfigMap frontend-config
          envFrom:
            - configMapRef:
                name: frontend-config
          # Sonde de santé Nginx
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            #ressources: cpu et mémoire pour le pod frontend
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi