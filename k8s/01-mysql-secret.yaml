apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:coumba}
  MYSQL_DATABASE: ${DB_NAME:-bijouterie}
  MYSQL_USER: ${DB_USER:coumba}
  MYSQL_PASSWORD: ${DB_PASSWORD:coumba}