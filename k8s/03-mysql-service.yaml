# Service MySQL : ClusterIP = accessible uniquement depuis l'intérieur du cluster.
# Son nom "mysql" devient un nom DNS interne (valeur de DB_HOST).
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  type: ClusterIP
  selector:                  # sélectionne les pods du Deployment mysql
    app: bijouterie
    tier: database
  ports:
    - port: 3306             # port du Service
      targetPort: 3306       # port du conteneur