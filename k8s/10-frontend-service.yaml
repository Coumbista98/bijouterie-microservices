# Service frontend : NodePort = seul point d'entrée depuis l'extérieur du cluster
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  type: NodePort
  selector:
    app: bijouterie
    tier: frontend
  ports:
    - port: 80          # port du Service dans le cluster
      targetPort: 80    # port du conteneur Nginx
      nodePort: 30080   # port ouvert sur le nœud (plage 30000-32767)