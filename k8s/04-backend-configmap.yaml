apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
data:
  PORT: "3000"
  DB_HOST: "mysql"            # = nom du service MySQL
  DB_PORT: "3306"
  DB_NAME: "bijouterie"
  DB_USER: "coumba"
  DB_PASSWORD: "coumba"
  SHOP_NAME: "Bijouterie de coumba"
  CURRENCY: "EUR"
  MAX_FILE_SIZE_MB: "5"